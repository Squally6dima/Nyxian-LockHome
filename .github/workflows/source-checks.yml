name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run source checks
        run: sh Tests/SourceChecks.sh
      - name: Run patch script tests
        run: python3 -m unittest discover -s Tests -p 'test_*.py'
